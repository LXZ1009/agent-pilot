[project]
name = "agent-pilot-backend"
version = "0.1.0"
description = "Python backend for a DeepAgents async subagents POC"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.5.3",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langchain-openai>=1.1.0",
    "pymysql>=1.1.1",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
langgraph = [
    "langgraph-cli[inmem]>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
